<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery - My School</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial,sans-serif;
        }

        body {
            background: #f5f7fa;
        }

        nav {
            background: #123c69;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #ffd166;
        }

        .header {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 50px;
        }

        .header h1 {
            font-size: 40px;
        }

        .gallery {
            padding: 50px 8%;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 25px;
        }

        .gallery-item {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
        }

        .gallery-item img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

        .gallery-item h3 {
            color: #123c69;
            text-align: center;
            padding: 18px;
        }

        footer {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media(max-width:800px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .gallery {
                grid-template-columns: repeat(2,1fr);
            }
        }

        @media(max-width:500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">🏫 MY SCHOOL</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="courses.html">Courses</a>
        <a href="admission.html">Admission</a>
        <a href="students.html">Students</a>
        <a href="teachers.html">Teachers</a>
        <a href="notice.html">Notice</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="location.html">Location</a>
        <a href="admin.html">Admin</a>
    </div>
</nav>

<div class="header">
    <h1>🖼️ School Gallery</h1>
    <p>Memories and moments from our school</p>
</div>

<section class="gallery">

    <div class="gallery-item">
        <img src="school.jpg" alt="School Building">
        <h3>🏫 School Building</h3>
    </div>

    <div class="gallery-item">
        <img src="school.jpg" alt="Classroom">
        <h3>📚 Classroom</h3>
    </div>

    <div class="gallery-item">
        <img src="school.jpg" alt="Science Lab">
        <h3>🔬 Science Lab</h3>
    </div>

    <div class="gallery-item">
        <img src="school.jpg" alt="Computer Lab">
        <h3>💻 Computer Lab</h3>
    </div>

    <div class="gallery-item">
        <img src="school.jpg" alt="Sports">
        <h3>⚽ Sports Activities</h3>
    </div>

    <div class="gallery-item">
        <img src="school.jpg" alt="School Event">
        <h3>🎉 School Event</h3>
    </div>

</section>

<footer>
    © 2026 My School. All Rights Reserved.
</footer>

</body>
</html>

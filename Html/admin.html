<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - My School</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial,sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        nav {
            background: #123c69;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .login {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-box {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.15);
        }

        .login-box .icon {
            text-align: center;
            font-size: 55px;
        }

        .login-box h1 {
            text-align: center;
            color: #123c69;
            margin: 10px 0;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 12px 0 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ffd166;
            color: #123c69;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #123c69;
            text-decoration: none;
        }

        footer {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media(max-width:500px) {
            .login-box {
                width: 100%;
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">🏫 MY SCHOOL</div>
    <a href="index.html">🏠 Home</a>
</nav>

<section class="login">

    <div class="login-box">

        <div class="icon">🔐</div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            School Administration Panel
        </p>

        <form onsubmit="login(event)">

            <label>👤 Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label>🔑 Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                🔓 Login
            </button>

        </form>

        <div class="back">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

</section>

<footer>
    © 2026 My School. All Rights Reserved.
</footer>

<script>

function login(event) {

    event.preventDefault();

    let username =
        document.getElementById("username").value;

    let password =
        document.getElementById("password").value;

    if (
        username === "admin" &&
        password === "admin123"
    ) {

        alert("✅ Login Successful!");

    } else {

        alert("❌ Invalid username or password!");

    }

}

</script>

</body>
</html>
